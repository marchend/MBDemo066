name: AcmeBank
options:
  bundleIdPrefix: com.acmebank
  deploymentTarget:
    iOS: "17.0"
packages:
  okta-mobile-swift:
    url: https://github.com/okta/okta-mobile-swift
    # Pinned to the 2.x minor line. `minorVersion` resolves to
    # "up to next minor" semantics in XcodeGen / SwiftPM, so a breaking
    # 3.x release will NOT be picked up automatically on a clean build.
    minorVersion: "2.0.0"
targets:
  AcmeBank:
    type: application
    platform: iOS
    sources: [AcmeBank]
    resources: [AcmeBank/Resources]
    dependencies:
      - package: okta-mobile-swift
        product: OktaDirectAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmebank.mobile
        SWIFT_VERSION: "5.10"
        # GENERATE_INFOPLIST_FILE is intentionally OFF. Xcode's generated
        # plist lives in DerivedData and is synthesised from build settings,
        # so it would never see the OktaIssuer / OktaClientId / OktaRedirectUri
        # / OktaScopes keys written by the `Inject Okta Config` pre-build
        # script. Instead we ship a source-tree `AcmeBank/Info.plist` (created
        # on demand from `AcmeBank/Info.plist.example`) that Xcode copies and
        # variable-expands into the built bundle, so the injected keys reach
        # `Bundle.main.infoDictionary` at runtime.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AcmeBank/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_ENTITLEMENTS: AcmeBank/AcmeBank.entitlements
    preBuildScripts:
      - name: Inject Okta Config
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${SRCROOT}/AcmeBank/Info.plist.example
        script: |
          set -u
          INFOPLIST="${SRCROOT}/AcmeBank/Info.plist"
          TEMPLATE="${SRCROOT}/AcmeBank/Info.plist.example"
          SENTINEL="__OKTA_NOT_CONFIGURED__"

          # `AcmeBank/Info.plist` is .gitignored (see SECURITY note in README).
          # Real Okta tenant values may be written into it on a developer
          # machine, so the file MUST NOT be tracked. On a fresh clone the
          # file does not exist yet — seed it from the committed template
          # `AcmeBank/Info.plist.example`, which contains only sentinel
          # placeholders.
          if [ ! -f "$INFOPLIST" ]; then
            if [ -f "$TEMPLATE" ]; then
              /bin/cp "$TEMPLATE" "$INFOPLIST"
            else
              # Last-resort fallback so a missing template never breaks the
              # build. CI tolerance is a hard requirement (see README,
              # "Okta build configuration").
              /bin/cat > "$INFOPLIST" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST
            fi
          fi

          inject_key() {
            KEY="$1"
            VALUE="$2"
            if [ -z "$VALUE" ]; then
              echo "warning: $KEY env var is unset — writing sentinel '$SENTINEL' to Info.plist. App will surface the 'not configured' banner at runtime."
              VALUE="$SENTINEL"
            fi
            # -replace creates the key if it doesn't already exist.
            /usr/bin/plutil -replace "$KEY" -string "$VALUE" "$INFOPLIST" || \
              /usr/bin/plutil -insert "$KEY" -string "$VALUE" "$INFOPLIST"
          }

          inject_key OktaIssuer       "${OKTA_ISSUER:-}"
          inject_key OktaClientId     "${OKTA_CLIENT_ID:-}"
          inject_key OktaRedirectUri  "${OKTA_REDIRECT_URI:-}"
          inject_key OktaScopes       "${OKTA_SCOPES:-}"

          # NEVER exit 1 — CI tolerance is a hard requirement (see README,
          # "Okta build configuration"). A missing env var must produce a
          # green build with sentinels, not a failed PhaseScriptExecution.
          exit 0
  AcmeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcmeBankTests]
    dependencies:
      - target: AcmeBank
  AcmeBankUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AcmeBankUITests]
    dependencies:
      - target: AcmeBank
    info:
      path: AcmeBankUITests/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: BNDL
schemes:
  AcmeBank:
    build:
      targets: { AcmeBank: all }
    test:
      targets:
        - AcmeBankTests
        - AcmeBankUITests
      parallelizable: false
